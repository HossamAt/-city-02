name: Unity License Activation

on:
  workflow_dispatch:

jobs:
  activation:
    name: Create Unity Activation File
    runs-on: ubuntu-latest

    steps:
      - name: Install Unity activation tools
        run: |
          wget -q https://download.unity3d.com/download_unity/6f7d4e5e9b2a/UnitySetup-Linux-Unity.tar.xz -O unity.tar.xz || true

      - name: Create activation file
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          echo "Preparing Unity activation..."
          echo "Unity version: 6000.3.11f1"
          echo "Email configured: yes"
